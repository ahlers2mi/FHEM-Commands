name: Update controls_Commands.txt

on:
  push:
    paths:
      - 'FHEM/98_Commands.pm'
      - 'www/pgm2/fhemweb_custom_link.js'
  workflow_dispatch:

jobs:
  update-controls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update controls_Commands.txt
        run: |
          : > controls_Commands.txt
          for f in FHEM/98_Commands.pm www/pgm2/fhemweb_custom_link.js; do
            [ -f "$f" ] || continue
            SIZE=$(wc -c < "$f")
            DATE=$(date -u +"%Y-%m-%d_%H:%M:%S")
            echo "UPD ${DATE} ${SIZE} ${f}" >> controls_Commands.txt
          done

      - name: Commit updated controls_Commands.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add controls_Commands.txt
          git diff --cached --quiet || git commit -m "Auto-update controls_Commands.txt"
          git push
